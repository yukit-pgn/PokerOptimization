<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ジョーカー1枚入りドローポーカーの最適交換計算機" />
    <title>Joker Poker Optimizer</title>
  </head>
  <body>
    <main class="page-shell">
      <header>
        <p class="eyebrow">ONE DRAW · ONE JOKER</p>
        <h1>Joker Poker Optimizer</h1>
        <p class="lead">手札を選ぶと、賞金倍率に基づき期待値が最大になる交換を計算します。</p>
      </header>

      <section class="panel" aria-labelledby="hand-heading">
        <h2 id="hand-heading">現在の手札</h2>
        <form id="hand-form">
          <div class="selected-hand-row">
            <div id="selected-hand" class="selected-hand" aria-live="polite"></div>
            <button id="reset-hand" class="reset-hand" type="button">手札をリセット</button>
          </div>
          <p class="selection-help">下のカード一覧から、手札になる5枚を選んでください。</p>
          <div class="card-table-wrap">
            <div id="card-table" class="card-table" aria-label="カード一覧"></div>
          </div>
          <p id="form-error" class="error" role="alert"></p>
          <label class="high-low-toggle"><input id="use-high-low" type="checkbox" checked /> ハイ＆ローを考慮する</label>
          <div class="maximum-payout-setting">
            <label class="high-low-toggle"><input id="use-maximum-payout" type="checkbox" /> 賞金額の最大値を設定</label>
            <label id="maximum-payout-field" class="maximum-payout-field" hidden>最大値（この値以上は対象外）<input id="maximum-payout" type="number" min="0" step="1" value="10000" inputmode="numeric" /></label>
          </div>
          <button id="calculate-button" type="submit">最適な交換を計算</button>
        </form>
      </section>

      <section id="result" class="panel result" aria-live="polite" hidden></section>

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
